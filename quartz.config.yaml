# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Migrated from Quartz 4 (quartz.config.ts + quartz.layout.ts @ feat/ibm-plex-fonts).
# Local typst customization (rehypeTypstCustom chain) is NOT yet ported — the Latex
# plugin runs MathJax with the v4 fallback macros for now. Font self-hosting fixes
# are intentionally deferred (fontOrigin: googleFonts + cdnCaching: false matches v4).
configuration:
  pageTitle: qttao.net
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: blog.qttao.site
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: false
    typography:
      header: IBM Plex Sans
      body: IBM Plex Serif
      code: IBM Plex Mono
    # Cupertino(iOS 风格)内联色板 —— 从 @quartz-themes/cupertino 提取映射(临时重建快照)
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#cfcfd2"
        gray: "#858587"
        darkgray: "#333338"
        dark: "#2a2a2e"
        secondary: "#8a5cf5"
        tertiary: "#a68af9"
        highlight: "rgba(138, 92, 245, 0.12)"
        textHighlight: "rgba(255, 208, 0, 0.4)"
      darkMode:
        light: "#1d1d20"
        lightgray: "#4d4d51"
        gray: "#99999b"
        darkgray: "#ffffff"
        dark: "#d1d1d1"
        secondary: "#a68af9"
        tertiary: "#c5b6fc"
        highlight: "rgba(166, 138, 249, 0.12)"
        textHighlight: "rgba(255, 208, 0, 0.4)"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only # v4: DesktopOnly(TableOfContents)
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      # TODO: port rehypeTypstCustom (preamble.typ injection, per-note typst→mathjax
      # fallback, baseline alignment) as a plugin package. Until then MathJax renders
      # everything, with the v4 physics-package fallback macros below.
      renderEngine: mathjax
      customMacros:
        "\\pqty": ["\\left(#1\\right)", 1]
        "\\bqty": ["\\left[#1\\right]", 1]
        "\\abs": ["\\left|#1\\right|", 1]
        "\\vb": ["\\mathbf{#1}", 1]
        "\\vu": ["\\hat{\\mathbf{#1}}", 1]
        "\\pdv": ["\\frac{\\partial #1}{\\partial #2}", 2]
        "\\curl": "\\nabla\\times"
        "\\grad": "\\nabla"
        "\\div": "\\nabla\\cdot"
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  # v4 had no hard-line-breaks transformer — keep single newlines unbroken for parity
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  # 主题包系统暂停使用:Obsidian 移植 CSS 未针对 Quartz 组件适配,渲染不可用。
  # cupertino 配色已提取到上方内联色板。重启只需 enabled: true + theme: <id>。
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  # blog 模板不含 encrypted-pages,对齐关闭
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  # v4 had CustomOgImages active; flip enabled to false for fast iteration
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  # v4 rendered TagList in beforeBody
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # v5: this plugin is also THE frontmatter parser (title/tags/aliases/dates).
  # Keep it enabled; hidePropertiesView restores the v4 look (no visible properties panel).
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options:
        # from data-repo
        repo: Mynanase/quartz
        # from data-repo-id
        repoId: R_kgDOOIs5yg
        # from data-category
        category: Announcements
        # from data-category-id
        categoryId: DIC_kwDOOIs5ys4CoC4p
        # from data-lang
        lang: en
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  # blog layout: recent notes in left sidebar (blog template config)
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: Recent Notes
      limit: 5
      linkToMore: false
      showTags: true
    layout:
      position: left
      priority: 25
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
