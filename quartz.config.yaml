# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: qttao.net
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: blog.qttao.site
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header:
        name: Noto Sans SC
        weights:
          - 400
          - 600
          - 700
      body:
        name: IBM Plex Sans
        weights:
          - 400
          - 600
          - 700
        includeItalic: true
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f8f9fa"
        lightgray: "#dfe4e8"
        gray: "#737d87"
        darkgray: "#3f4854"
        dark: "#252e3a"
        secondary: "#315d7c"
        tertiary: "#326f68"
        highlight: "rgba(49, 93, 124, 0.09)"
        textHighlight: "#ead39466"
      darkMode:
        light: "#191c21"
        lightgray: "#343b45"
        gray: "#9aa3ae"
        darkgray: "#e3e3e3"
        dark: "#f0f2f4"
        secondary: "#9ec4e0"
        tertiary: "#a2d4c6"
        highlight: "rgba(158, 196, 224, 0.12)"
        textHighlight: "#b6983b44"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      maxDepth: 3
      minEntries: 1
      collapseByDefault: false
      layout: modern
    order: 50
    layout:
      position: right
      priority: 20
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: false
    order: 80
  - source: ./local-plugins/latex
    enabled: true
    options:
      renderEngine: typst
      # customMacros:
      #   \pqty:
      #     - \left(#1\right)
      #     - 1
      #   \bqty:
      #     - \left[#1\right]
      #     - 1
      #   \abs:
      #     - \left|#1\right|
      #     - 1
      #   \vb:
      #     - \mathbf{#1}
      #     - 1
      #   \vu:
      #     - \hat{\mathbf{#1}}
      #     - 1
      #   \pdv:
      #     - "\\frac{\\partial #1}{\\partial #2}"
      #     - 2
      #   \curl: \nabla\times
      #   \grad: \nabla
      #   \div: \nabla\cdot
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      # 此插件只生成字体栈；字体下载仍由上面的 theme.typography / CDN 配置负责。
      fontOrigin: local
      body: &reading-font-stack >-
        "IBM Plex Sans", "IBM Plex Sans SC", "PingFang SC", "Noto Sans SC",
        "Hiragino Sans GB", "Microsoft YaHei", system-ui, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"
      header: *reading-font-stack
      title: *reading-font-stack
      interface: *reading-font-stack
      code: '"IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace'
  - source: ./local-plugins/web-fonts
    enabled: true
    options:
      baseUrl: https://ik.imagekit.io/eosmos/WebFonts/ibm-plex-sans-sc/1.1.0/
    order: 93
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 20
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: ./local-plugins/page-list
    enabled: true
    options:
      slug: all-notes
      title: All Notes
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      showFolderCount: false
      showSubfolders: true
      prefixFolders: false
  - source: ./local-plugins/tag-page
    enabled: true
    # 两种页面的匹配优先级相同；先加载标签页，避免 tags/index 被当成文件夹页。
    order: 40
    options:
      numPages: 5
      prefixTags: false
  - source: "@quartz-community/explorer"
    enabled: false
    options:
      title: Explorer
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: ./local-plugins/blog-navigation
    enabled: true
    options:
      label: Main navigation
      links:
        - text: Home
          slug: index
        - text: Posts
          slug: posts/index
        - text: Notes
          slug: notes/index
        - text: Life
          slug: life/index
        - text: Tags
          slug: tags/index
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options:
        repo: Mynanase/quartz
        repoId: R_kgDOOIs5yg
        category: Announcements
        categoryId: DIC_kwDOOIs5ys4CoC4p
        lang: en
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Mynanase
        RSS: https://blog.qttao.site/index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: Recent Notes
      limit: 5
      linkToMore: all-notes
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 60
      display: desktop-only
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: github:quartz-community/tui
    enabled: true
    options: {}
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/content-meta"
        - "@quartz-community/table-of-contents"
        - "@quartz-community/backlinks"
    tag:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/content-meta"
        - "@quartz-community/table-of-contents"
        - "@quartz-community/backlinks"
    canvas: {}
    bases: {}
