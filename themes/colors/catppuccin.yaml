name: "Catppuccin · Latte / Mocha"
description: "冷灰蓝与柔和紫蓝，有明显的数字界面气质。以官方 Latte / Mocha 色板为基础；Latte 蓝色从 #1e66f5 加深为 #1a5cdb（原值对背景约 4.34:1），标题与正文共享 text，透明底色为网页适配。来源：catppuccin.com/palette"
